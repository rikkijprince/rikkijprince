<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rikki J Prince",
    "url": "https://rikkijprince.com",
    "jobTitle": "Author",
    "sameAs": ["https://www.amazon.com/author/rikkijprince"]
  }
  </script>

  {% include book-schema.html %}
</head>
<body>
  {% include navbar.html %}

  <main class="page-content">
    <div class="page__inner-wrap">
      {{ content }}
    </div>
  </main>

  <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
